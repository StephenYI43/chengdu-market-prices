name: chengdu-market-prices
services:
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1536m
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: chengdu-market-prices-app:day1
    entrypoint: []
    command: ["/app/.venv/bin/uvicorn", "market_prices.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18880:8000"
    environment:
      PYTHONPATH: /app/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKET_RUNTIME_DIR: /app/runtime
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  stream:
    image: chengdu-market-prices-app:day1
    entrypoint: []
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "2g", "--conf", "spark.jars.ivy=/opt/spark/ivy", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.13:4.3.0", "scripts/stream_worker.py"]
    environment:
      PYTHONPATH: /app/src
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYSPARK_DRIVER_PYTHON: /app/.venv/bin/python
      SPARK_LOCAL_IP: 127.0.0.1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKET_RUNTIME_DIR: /app/runtime
      MARKET_IMPORT_TOPIC: price.imports.v1
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts
      - spark-ivy:/opt/spark/ivy
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 5g
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from market_prices.job_store import JobStore; raise SystemExit(0 if JobStore().worker_status()['online'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  api-acceptance:
    extends:
      service: api
    profiles: ["acceptance"]
    ports: !override
      - "127.0.0.1:18882:8000"
    volumes: !override
      - ${MARKET_ACCEPTANCE_RUNTIME:-./runtime/day4-acceptance}:/app/runtime
      - ${MARKET_ACCEPTANCE_ARTIFACTS:-./artifacts/day4-acceptance}:/app/artifacts
  stream-acceptance:
    extends:
      service: stream
    profiles: ["acceptance"]
    environment:
      MARKET_IMPORT_TOPIC: price.imports.acceptance.v1
    volumes: !override
      - ${MARKET_ACCEPTANCE_RUNTIME:-./runtime/day4-acceptance}:/app/runtime
      - ${MARKET_ACCEPTANCE_ARTIFACTS:-./artifacts/day4-acceptance}:/app/artifacts
      - spark-ivy:/opt/spark/ivy
  forecast:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ml
    image: chengdu-market-prices-forecast:day5
    entrypoint: []
    command: ["/app/.venv/bin/python", "scripts/forecast_worker.py"]
    environment:
      PYTHONPATH: /app/src
      MARKET_RUNTIME_DIR: /app/runtime
      MLFLOW_ENABLE_TELEMETRY: "false"
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from market_prices.forecast_store import service_status; raise SystemExit(0 if service_status()['online'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  forecast-acceptance:
    extends:
      service: forecast
    profiles: ["acceptance"]
    volumes: !override
      - ${MARKET_ACCEPTANCE_RUNTIME:-./runtime/day4-acceptance}:/app/runtime
      - ${MARKET_ACCEPTANCE_ARTIFACTS:-./artifacts/day4-acceptance}:/app/artifacts
  worker:
    image: chengdu-market-prices-app:day1
    profiles: ["tools"]
    entrypoint: []
    command: ["/app/.venv/bin/python", "--version"]
    environment:
      PYTHONPATH: /app/src
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYSPARK_DRIVER_PYTHON: /app/.venv/bin/python
      SPARK_LOCAL_IP: 127.0.0.1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts
      - spark-ivy:/opt/spark/ivy
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 5g
volumes:
  kafka-data:
  spark-ivy:
